{% extends "base.html" %}
{% block title %}New Test Run — UI Test Platform{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

  <h1 class="text-2xl font-bold mb-6">New Test Run</h1>

  <!-- Upload form -->
  <div x-data="runForm()" class="bg-white rounded-lg shadow p-6 mb-8">
    <form @submit.prevent="submit" enctype="multipart/form-data">

      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" for="target_url">Target URL</label>
        <input
          id="target_url"
          type="url"
          x-model="targetUrl"
          required
          placeholder="https://example.com"
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" for="file">Test Cases File (.xlsx)</label>
        <input
          id="file"
          type="file"
          accept=".xlsx"
          @change="fileSelected($event)"
          required
          class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-3 file:rounded file:border-0 file:text-sm file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
        />
      </div>

      <div class="mb-6 flex items-center gap-2">
        <input id="requires_auth" type="checkbox" x-model="requiresAuth" class="rounded" />
        <label for="requires_auth" class="text-sm">Requires authentication (upload auth_state.json after creating run)</label>
      </div>

      <button
        type="submit"
        :disabled="loading"
        class="w-full bg-indigo-600 text-white rounded py-2 px-4 font-medium hover:bg-indigo-700 disabled:opacity-50"
      >
        <span x-show="!loading">Start Run</span>
        <span x-show="loading">Starting…</span>
      </button>

      <p x-show="error" x-text="error" class="mt-3 text-sm text-red-600"></p>
    </form>
  </div>

  <!-- Recent runs -->
  <div x-data="runList()" x-init="load()">
    <h2 class="text-lg font-semibold mb-3">Recent Runs</h2>

    <template x-if="runs.length === 0 && !loading">
      <p class="text-sm text-gray-500">No runs yet.</p>
    </template>

    <ul class="space-y-2">
      <template x-for="run in runs" :key="run.id">
        <li class="bg-white rounded-lg shadow px-4 py-3 flex items-center justify-between">
          <div>
            <a :href="'/runs/' + run.id" class="font-medium text-indigo-600 hover:underline text-sm" x-text="run.input_filename"></a>
            <p class="text-xs text-gray-500 mt-0.5" x-text="run.target_url"></p>
          </div>
          <div class="text-right">
            <span
              class="inline-block text-xs font-semibold px-2 py-0.5 rounded-full"
              :class="statusClass(run.status)"
              x-text="run.status"
            ></span>
            <p class="text-xs text-gray-400 mt-0.5" x-text="formatDate(run.created_at)"></p>
          </div>
        </li>
      </template>
    </ul>
  </div>

</div>

<script>
function runForm() {
  return {
    targetUrl: '',
    requiresAuth: false,
    file: null,
    loading: false,
    error: '',

    fileSelected(e) {
      this.file = e.target.files[0] || null;
    },

    async submit() {
      this.loading = true;
      this.error = '';
      try {
        const fd = new FormData();
        fd.append('target_url', this.targetUrl);
        fd.append('requires_auth', this.requiresAuth ? 'true' : 'false');
        fd.append('file', this.file);

        const res = await fetch('/api/v1/runs', { method: 'POST', body: fd });
        if (!res.ok) {
          const data = await res.json();
          this.error = data.detail || 'Error creating run.';
          return;
        }
        const run = await res.json();
        window.location.href = '/runs/' + run.id;
      } catch (e) {
        this.error = 'Network error. Please try again.';
      } finally {
        this.loading = false;
      }
    }
  };
}

function runList() {
  return {
    runs: [],
    loading: false,

    async load() {
      this.loading = true;
      try {
        const res = await fetch('/api/v1/runs?limit=20');
        if (res.ok) this.runs = await res.json();
      } finally {
        this.loading = false;
      }
    },

    statusClass(s) {
      const map = {
        pending:   'bg-gray-100 text-gray-700',
        running:   'bg-blue-100 text-blue-700',
        completed: 'bg-green-100 text-green-700',
        failed:    'bg-red-100 text-red-700',
        timed_out: 'bg-orange-100 text-orange-700',
        cancelled: 'bg-gray-100 text-gray-500',
      };
      return map[s] || 'bg-gray-100 text-gray-600';
    },

    formatDate(iso) {
      return new Date(iso).toLocaleString();
    }
  };
}
</script>
{% endblock %}
