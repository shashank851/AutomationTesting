{% extends "base.html" %}
{% block title %}Run {{ run.id }} — UI Test Platform{% endblock %}

{% block content %}
<div x-data="runDetail('{{ run.id }}', '{{ run.status }}')" x-init="init()">

  <!-- Header -->
  <div class="flex items-start justify-between mb-6">
    <div>
      <a href="/" class="text-sm text-gray-500 hover:text-indigo-600">← All Runs</a>
      <h1 class="text-xl font-bold mt-1" x-text="'Run: ' + runData.input_filename"></h1>
      <p class="text-sm text-gray-500 mt-0.5" x-text="runData.target_url"></p>
    </div>
    <div class="text-right">
      <span
        class="inline-block text-sm font-semibold px-3 py-1 rounded-full"
        :class="statusClass(runData.status)"
        x-text="runData.status"
      ></span>
      <template x-if="runData.duration_seconds != null">
        <p class="text-xs text-gray-400 mt-1" x-text="runData.duration_seconds.toFixed(1) + 's'"></p>
      </template>
    </div>
  </div>

  <!-- Auth setup wizard (shown when run is waiting for login) -->
  <template x-if="runData.status === 'pending_auth' && !runData.auth_state_path">
    <div class="bg-white border border-amber-200 rounded-xl shadow-sm mb-6 overflow-hidden">
      <!-- Header -->
      <div class="bg-amber-50 border-b border-amber-200 px-6 py-4 flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 font-bold text-sm flex-shrink-0">!</div>
        <div>
          <p class="font-semibold text-amber-900">Authentication Required</p>
          <p class="text-sm text-amber-700">This run needs a login session before it can start. Follow the 3 steps below.</p>
        </div>
      </div>

      <div class="px-6 py-5 space-y-5">

        <!-- Step 1 -->
        <div class="flex gap-4">
          <div class="w-7 h-7 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">1</div>
          <div>
            <p class="font-medium text-gray-800 text-sm">Download the login setup script</p>
            <p class="text-xs text-gray-500 mt-0.5 mb-2">A Python script pre-configured for <span class="font-mono" x-text="runData.target_url"></span></p>
            <a
              :href="'/api/v1/runs/' + runData.id + '/auth-setup-script'"
              download
              class="inline-flex items-center gap-1.5 bg-indigo-600 text-white text-xs font-medium rounded px-3 py-1.5 hover:bg-indigo-700"
            >
              ⬇ Download setup_auth.py
            </a>
          </div>
        </div>

        <!-- Step 2 -->
        <div class="flex gap-4">
          <div class="w-7 h-7 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">2</div>
          <div>
            <p class="font-medium text-gray-800 text-sm">Run the script on your local machine</p>
            <p class="text-xs text-gray-500 mt-1 mb-2">Open a terminal, install Playwright if needed, then run:</p>
            <div class="bg-gray-900 text-green-400 text-xs font-mono rounded-lg px-4 py-3 space-y-1">
              <div># One-time setup (if not already installed)</div>
              <div>pip install playwright &amp;&amp; playwright install chromium</div>
              <div class="mt-2"># Run the auth setup</div>
              <div>python setup_auth_<span x-text="runData.id"></span>.py</div>
            </div>
            <p class="text-xs text-gray-500 mt-2">A browser window will open → log in → close the browser → <code class="bg-gray-100 px-1 rounded">auth_state.json</code> is saved.</p>
          </div>
        </div>

        <!-- Step 3 -->
        <div class="flex gap-4">
          <div class="w-7 h-7 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">3</div>
          <div class="w-full">
            <p class="font-medium text-gray-800 text-sm">Upload the saved <code class="bg-gray-100 px-1 rounded text-xs">auth_state.json</code></p>
            <p class="text-xs text-gray-500 mt-0.5 mb-3">The run will start automatically once uploaded.</p>

            <!-- Drop zone -->
            <div
              class="border-2 border-dashed rounded-lg p-5 text-center transition-colors"
              :class="dragOver ? 'border-indigo-400 bg-indigo-50' : 'border-gray-300 bg-gray-50'"
              @dragover.prevent="dragOver = true"
              @dragleave="dragOver = false"
              @drop.prevent="dragOver = false; authFile = $event.dataTransfer.files[0]"
            >
              <template x-if="!authFile">
                <div>
                  <p class="text-sm text-gray-500">Drag &amp; drop <code class="bg-white border rounded px-1 text-xs">auth_state.json</code> here, or</p>
                  <label class="mt-2 inline-block cursor-pointer">
                    <span class="text-indigo-600 text-sm font-medium hover:underline">browse to select file</span>
                    <input type="file" accept=".json" class="hidden" @change="authFile = $event.target.files[0]" />
                  </label>
                </div>
              </template>
              <template x-if="authFile">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 text-sm text-gray-700">
                    <span class="text-green-500">✓</span>
                    <span x-text="authFile.name"></span>
                    <span class="text-xs text-gray-400" x-text="'(' + (authFile.size / 1024).toFixed(1) + ' KB)'"></span>
                  </div>
                  <button @click="authFile = null" class="text-xs text-gray-400 hover:text-red-500">✕ Remove</button>
                </div>
              </template>
            </div>

            <button
              @click="uploadAuthState()"
              :disabled="!authFile || uploadingAuth"
              class="mt-3 w-full bg-green-600 text-white text-sm font-medium rounded-lg py-2.5 hover:bg-green-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
            >
              <span x-show="!uploadingAuth">Upload &amp; Start Run →</span>
              <span x-show="uploadingAuth">Uploading…</span>
            </button>
            <p x-show="authError" x-text="authError" class="text-xs text-red-600 mt-2"></p>
          </div>
        </div>

      </div>
    </div>
  </template>

  <!-- Progress bar -->
  <template x-if="runData.total_tests">
    <div class="mb-6">
      <div class="flex justify-between text-xs text-gray-500 mb-1">
        <span x-text="completedCount + ' / ' + runData.total_tests + ' tests'"></span>
        <span x-text="progressPct + '%'"></span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div
          class="h-2 rounded-full transition-all duration-300"
          :class="runData.status === 'failed' ? 'bg-red-500' : 'bg-indigo-500'"
          :style="'width:' + progressPct + '%'"
        ></div>
      </div>
    </div>
  </template>

  <!-- Status pills -->
  <div class="flex gap-4 mb-6 text-sm">
    <div class="flex items-center gap-1">
      <span class="w-3 h-3 rounded-full bg-green-400 inline-block"></span>
      <span x-text="'PASS ' + runData.passed_count"></span>
    </div>
    <div class="flex items-center gap-1">
      <span class="w-3 h-3 rounded-full bg-red-400 inline-block"></span>
      <span x-text="'FAIL ' + runData.failed_count"></span>
    </div>
    <div class="flex items-center gap-1">
      <span class="w-3 h-3 rounded-full bg-yellow-400 inline-block"></span>
      <span x-text="'MANUAL ' + runData.manual_count"></span>
    </div>
    <div class="flex items-center gap-1">
      <span class="w-3 h-3 rounded-full bg-gray-300 inline-block"></span>
      <span x-text="'SKIP ' + runData.skipped_count"></span>
    </div>
  </div>

  <!-- Download button -->
  <template x-if="runData.status === 'completed'">
    <a
      :href="'/api/v1/runs/' + runData.id + '/download'"
      class="inline-block mb-6 bg-green-600 text-white text-sm rounded px-4 py-2 hover:bg-green-700"
    >
      Download Results (.xlsx)
    </a>
  </template>

  <!-- Error message -->
  <template x-if="runData.error_message">
    <div class="bg-red-50 border border-red-200 rounded p-3 mb-6 text-sm text-red-700" x-text="runData.error_message"></div>
  </template>

  <!-- Results table -->
  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide">
        <tr>
          <th class="px-4 py-2 text-left w-20">ID</th>
          <th class="px-4 py-2 text-left">Title</th>
          <th class="px-4 py-2 text-left w-24">Status</th>
          <th class="px-4 py-2 text-left">Actual Result</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="r in results" :key="r.test_case_id">
          <tr class="border-t border-gray-100 hover:bg-gray-50">
            <td class="px-4 py-2 font-mono text-xs text-gray-600" x-text="r.test_case_id"></td>
            <td class="px-4 py-2 text-gray-700" x-text="r.title || '—'"></td>
            <td class="px-4 py-2">
              <span
                class="inline-block text-xs font-semibold px-2 py-0.5 rounded-full"
                :class="resultClass(r.status)"
                x-text="r.status"
              ></span>
            </td>
            <td class="px-4 py-2 text-xs text-gray-500 max-w-xs truncate" x-text="r.actual_result || '—'" :title="r.actual_result"></td>
          </tr>
        </template>
        <template x-if="results.length === 0">
          <tr>
            <td colspan="4" class="px-4 py-6 text-center text-gray-400 text-sm">No results yet.</td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

</div>

<script>
function runDetail(runId, initialStatus) {
  return {
    runId,
    runData: {
      id: runId,
      status: initialStatus,
      input_filename: '{{ run.input_filename }}',
      target_url: '{{ run.target_url }}',
      requires_auth: {{ 'true' if run.requires_auth else 'false' }},
      auth_state_path: {{ '"' + run.auth_state_path + '"' if run.auth_state_path else 'null' }},
      total_tests: {{ run.total_tests or 'null' }},
      passed_count: {{ run.passed_count }},
      failed_count: {{ run.failed_count }},
      manual_count: {{ run.manual_count }},
      skipped_count: {{ run.skipped_count }},
      duration_seconds: {{ run.duration_seconds or 'null' }},
      error_message: {{ '"' + run.error_message + '"' if run.error_message else 'null' }},
    },
    results: [],
    authFile: null,
    dragOver: false,
    uploadingAuth: false,
    authError: '',
    evtSource: null,

    get completedCount() {
      return (this.runData.passed_count || 0)
           + (this.runData.failed_count || 0)
           + (this.runData.manual_count || 0)
           + (this.runData.skipped_count || 0);
    },

    get progressPct() {
      if (!this.runData.total_tests) return 0;
      return Math.min(100, Math.round((this.completedCount / this.runData.total_tests) * 100));
    },

    async init() {
      await this.loadResults();

      const terminal = ['completed', 'failed', 'timed_out', 'cancelled'];
      const waiting  = ['pending_auth'];
      if (!terminal.includes(this.runData.status) && !waiting.includes(this.runData.status)) {
        this.connectSSE();
      }
    },

    async loadRunData() {
      try {
        const res = await fetch(`/api/v1/runs/${this.runId}`);
        if (res.ok) {
          const run = await res.json();
          Object.assign(this.runData, run);
        }
      } catch {}
    },

    async loadResults() {
      try {
        const res = await fetch(`/api/v1/runs/${this.runId}/results`);
        if (res.ok) this.results = await res.json();
      } catch {}
    },

    connectSSE() {
      this.evtSource = new EventSource(`/api/v1/runs/${this.runId}/stream`);

      this.evtSource.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.event_type === 'status_change') {
            Object.assign(this.runData, msg.payload);
            const terminal = ['completed', 'failed', 'timed_out', 'cancelled'];
            if (msg.payload.status === 'running') {
              await this.loadRunData();  // pick up total_tests + timestamps from DB
            }
            if (terminal.includes(msg.payload.status)) {
              this.evtSource.close();
              await this.loadRunData();
              this.loadResults();
            }
          } else if (msg.event_type === 'test_completed') {
            const p = msg.payload;
            const idx = this.results.findIndex(r => r.test_case_id === p.test_case_id);
            const entry = {
              test_case_id: p.test_case_id,
              title: p.title || null,
              status: p.status,
              actual_result: p.actual,
              comments: p.comment,
            };
            if (idx >= 0) {
              this.results[idx] = entry;
            } else {
              this.results.push(entry);
            }
            // Update counters
            const s = p.status;
            if (s === 'PASS')   this.runData.passed_count++;
            else if (s === 'FAIL')   this.runData.failed_count++;
            else if (s === 'MANUAL') this.runData.manual_count++;
            else if (s === 'SKIP')   this.runData.skipped_count++;
          }
        } catch {}
      };

      this.evtSource.onerror = () => {
        this.evtSource.close();
      };
    },

    async uploadAuthState() {
      if (!this.authFile) return;
      this.uploadingAuth = true;
      this.authError = '';
      try {
        const fd = new FormData();
        fd.append('file', this.authFile);
        const res = await fetch(`/api/v1/runs/${this.runId}/auth-state`, {
          method: 'POST', body: fd
        });
        if (!res.ok) {
          const d = await res.json();
          this.authError = d.detail || 'Upload failed.';
        } else {
          // Auth uploaded — refresh run data from DB then connect SSE
          await this.loadRunData();
          this.connectSSE();
        }
      } catch {
        this.authError = 'Network error.';
      } finally {
        this.uploadingAuth = false;
      }
    },

    statusClass(s) {
      const map = {
        pending_auth: 'bg-amber-100 text-amber-700',
        pending:   'bg-gray-100 text-gray-700',
        running:   'bg-blue-100 text-blue-700',
        completed: 'bg-green-100 text-green-700',
        failed:    'bg-red-100 text-red-700',
        timed_out: 'bg-orange-100 text-orange-700',
        cancelled: 'bg-gray-100 text-gray-500',
      };
      return map[s] || 'bg-gray-100 text-gray-600';
    },

    resultClass(s) {
      const map = {
        PASS:   'bg-green-100 text-green-700',
        FAIL:   'bg-red-100 text-red-700',
        MANUAL: 'bg-yellow-100 text-yellow-700',
        SKIP:   'bg-gray-100 text-gray-500',
      };
      return map[s] || 'bg-gray-100 text-gray-600';
    },
  };
}
</script>
{% endblock %}
