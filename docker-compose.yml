version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: uitestplatform
      POSTGRES_USER: uitest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "uitest", "-d", "uitestplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # live reload in dev
      - ./frontend:/app/frontend
      - uploads:/app/uploads
      - results:/app/results
    environment:
      DATABASE_URL: postgresql+asyncpg://uitest:${POSTGRES_PASSWORD:-changeme}@db:5432/uitestplatform
      SYNC_DATABASE_URL: postgresql+psycopg2://uitest:${POSTGRES_PASSWORD:-changeme}@db:5432/uitestplatform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -E -Q test_runs,celery
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - results:/app/results
    environment:
      # Worker uses sync psycopg2 driver (Playwright is sync, Celery is sync)
      SYNC_DATABASE_URL: postgresql+psycopg2://uitest:${POSTGRES_PASSWORD:-changeme}@db:5432/uitestplatform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      UPLOAD_DIR: /app/uploads
      RESULTS_DIR: /app/results
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    shm_size: "1gb"   # Chromium uses shared memory — default 64MB kills it
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  uploads:
  results:
